<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanE 南易管理后台</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>

  <!-- ===== Login Section ===== -->
  <section id="login-section" class="login-section">
    <div class="login-card glass">
      <div class="login-brand">
        <h1>NanE 南易</h1>
        <p>管理后台</p>
      </div>
      <div class="login-form">
        <input id="username" placeholder="用户名" autocomplete="username">
        <input id="password" type="password" placeholder="密码" autocomplete="current-password">
        <button class="primary wide" id="adminLoginBtn">登录</button>
      </div>
      <p class="login-hint">默认密码来自 ADMIN_PASSWORD 环境变量</p>
    </div>
  </section>

  <!-- ===== Dashboard ===== -->
  <div id="dashboard" class="dashboard" style="display:none">

    <!-- Header -->
    <header class="admin-header glass">
      <div class="header-left">
        <h1>NanE 南易</h1>
        <span class="header-sub">管理后台</span>
      </div>
      <div class="header-right">
        <span id="admin-info" class="header-admin"></span>
        <button class="secondary small" id="adminLogoutBtn">退出</button>
      </div>
    </header>

    <main class="admin-main">

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(200,140,30,0.18);color:#b8860b;">!</div>
          <div class="stat-body">
            <span class="stat-label">待审核</span>
            <strong id="s-reviewing" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(37,115,90,0.18);color:#25735a;">&#10003;</div>
          <div class="stat-body">
            <span class="stat-label">上架中</span>
            <strong id="s-online" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(179,38,30,0.18);color:#b3261e;">&#10005;</div>
          <div class="stat-body">
            <span class="stat-label">已下架</span>
            <strong id="s-offline" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(110,0,101,0.18);color:#6E0065;">&#128065;</div>
          <div class="stat-body">
            <span class="stat-label">今日查看</span>
            <strong id="s-contact" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(37,115,90,0.18);color:#25735a;">&#10003;</div>
          <div class="stat-body">
            <span class="stat-label">已履约</span>
            <strong id="s-claims" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass">
          <div class="stat-icon" style="background:rgba(110,0,101,0.18);color:#6E0065;">&#9733;</div>
          <div class="stat-body">
            <span class="stat-label">履约评价</span>
            <strong id="s-reviews" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass" id="stat-total-users">
          <div class="stat-icon" style="background:rgba(61,90,153,0.18);color:#3d5a99;">&#128101;</div>
          <div class="stat-body">
            <span class="stat-label">总用户</span>
            <strong id="s-total-users" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass" id="stat-banned-users">
          <div class="stat-icon" style="background:rgba(179,38,30,0.18);color:#b3261e;">&#128683;</div>
          <div class="stat-body">
            <span class="stat-label">已封禁</span>
            <strong id="s-banned-users" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass" id="stat-new-users">
          <div class="stat-icon" style="background:rgba(37,115,90,0.18);color:#25735a;">&#128200;</div>
          <div class="stat-body">
            <span class="stat-label">今日新增</span>
            <strong id="s-new-users" class="stat-value">0</strong>
          </div>
        </div>
        <div class="stat-card glass" id="stat-reports">
          <div class="stat-icon" style="background:rgba(200,60,30,0.18);color:#c83c1e;">&#9878;</div>
          <div class="stat-body">
            <span class="stat-label">待处理举报</span>
            <strong id="s-pending-reports" class="stat-value">0</strong>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar glass">
        <div class="toolbar-left">
          <select id="item-status">
            <option value="reviewing">待审核</option>
            <option value="online">上架中</option>
            <option value="rejected">已驳回</option>
            <option value="taken_down">已下架</option>
            <option value="claimed">已领取</option>
            <option value="all">全部</option>
          </select>
          <button class="secondary" id="adminRefreshBtn">刷新</button>
        </div>
        <label class="select-all-label">
          <input type="checkbox" id="select-all">
          全选
        </label>
      </div>

      <!-- Items Container -->
      <div id="items" class="items-list"></div>

      <!-- Reports Section -->
      <div id="reports-section" class="reports-section" style="margin-top:24px">
        <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3>举报管理</h3>
          <select id="report-status">
            <option value="pending">待处理</option>
            <option value="reviewed">已处理</option>
          </select>
        </div>
        <div id="reports-list" class="items-list"></div>
      </div>

      <!-- Building Activity Section -->
      <div id="activity-section" class="activity-admin-section glass">
        <div class="section-head activity-admin-head">
          <div>
            <h3>楼栋动态</h3>
            <p>查看指定楼栋的最近分享与已确认领取</p>
          </div>
          <div class="activity-admin-controls">
            <select id="activity-campus"></select>
            <select id="activity-building"></select>
            <select id="activity-limit">
              <option value="10">最近 10 条</option>
              <option value="20" selected>最近 20 条</option>
              <option value="50">最近 50 条</option>
            </select>
            <button class="secondary" id="activityRefreshBtn">刷新</button>
          </div>
        </div>
        <div class="activity-admin-stats">
          <div><span>上架中</span><strong id="activity-online">0</strong></div>
          <div><span>已履约</span><strong id="activity-claims">0</strong></div>
          <div><span>发布者</span><strong id="activity-owners">0</strong></div>
          <div><span>最近动态</span><strong id="activity-recent">0</strong></div>
        </div>
        <p id="activity-last" class="activity-admin-last">暂无最近动态</p>
        <div id="activity-admin-list" class="activity-admin-list"></div>
      </div>

    </main>
  </div>

  <!-- ===== Batch Action Bar ===== -->
  <div id="batch-bar" class="batch-bar glass" hidden>
    <span id="selected-count">已选择 0 项</span>
    <div class="batch-actions">
      <button class="primary small" data-batch="approve">批量通过</button>
      <button class="secondary small" data-batch="reject">批量驳回</button>
      <button class="danger small" data-batch="take-down">批量下架</button>
    </div>
  </div>

  <!-- ===== Admin Management ===== -->
  <section id="admin-management" style="display:none" class="card admin-section">
    <div class="admin-section-head">
      <h3>管理员管理</h3>
    </div>
    <div id="admin-list" class="admin-list"></div>
    <div class="admin-add-row">
      <input id="new-admin-username" placeholder="用户名">
      <input id="new-admin-password" type="password" placeholder="密码">
      <select id="new-admin-role">
        <option value="viewer">观察员</option>
        <option value="moderator">审核员</option>
        <option value="super_admin">超级管理员</option>
      </select>
      <button class="primary" id="create-admin-btn">添加管理员</button>
    </div>
  </section>

  <!-- ===== Reject Reason Dialog ===== -->
  <dialog id="rejectDialog" class="modal-dialog">
    <div class="dialog-head">
      <h3>驳回原因</h3>
      <button class="dialog-close" aria-label="关闭">&times;</button>
    </div>
    <textarea id="reject-reason" rows="3" placeholder="请输入驳回原因..."></textarea>
    <div class="dialog-actions">
      <button class="secondary" id="rejectCancelBtn">取消</button>
      <button class="primary" id="rejectConfirmBtn">确认驳回</button>
    </div>
  </dialog>

  <!-- ===== Toast Container ===== -->
  <div id="toastContainer"></div>

  <script src="/admin/app.js"></script>
</body>
</html>
